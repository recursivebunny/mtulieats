<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>
            MTU username (i.e. if your mtu email is stnovabeast@mtu.edu, enter stnovabeast):
            <input type="text" name="username" id="username"></input>
            <button id="verifybutton" onclick="verify()">Verify</button>
            
            <script>
                async function verify() {
                    let params = new URLSearchParams(document.location.search);
                    ret = params.get("returnto")
                    const u = document.getElementById("username").value
                    if (u == "") {
                        console.error("no username!")
                        return;
                    }
                    const resp = await fetch("/eat/api/login", {
                        method: "POST",
                        body: JSON.stringify({
                            "username": u
                        })
                    })
                    if (!resp.ok) {
                        if (resp.status == 500) {
                            console.error("email failed")
                        }
                    } else {
                        window.location.href = "/eat/verify?username=" + u + "&returnto=" + ret
                    }
                }
            </script>
        </div>
    </body>
</html>
